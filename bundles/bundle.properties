ctrlz.category = Undo
setting.ctrlz.enabled.name = Enable Undo
setting.ctrlz.enabled.description = Toggles whether the mod runs (no need to uninstall it)
setting.ctrlz.limit.name = Undo Limit
setting.ctrlz.limit.description = Max number of actions the mod remembers. Larger values may slightly affect performance
setting.ctrlz.recordPlace.name = Record Placements
setting.ctrlz.recordPlace.description = Whether block placements are recorded. Removal recording is unaffected
setting.ctrlz.recordOverride.name = Record Overwritten Blocks
setting.ctrlz.recordOverride.description = Whether overwritten blocks can be restored on undo (recommended)
setting.ctrlz.showHint.name = Hint on Undo
setting.ctrlz.showHint.description = Whether a hint appears when undoing
setting.ctrlz.hintSize.name = Hint Text Size
setting.ctrlz.hintSize.description = Scaling of the undo hint text
