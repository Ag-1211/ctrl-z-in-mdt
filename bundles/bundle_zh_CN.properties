ctrlz.category = 撤销
setting.ctrlz.enabled.name = 启用撤销
setting.ctrlz.enabled.description = 这将决定模组是否运行(您不需要删除本模组)
setting.ctrlz.limit.name = 撤销次数上限
setting.ctrlz.limit.description = 这将决定模组能记住您的操作次数上限，数值过大可能会有轻微的性能问题
setting.ctrlz.recordPlace.name = 记录建造操作
setting.ctrlz.recordPlace.description = 这将决定模组是否记录您的建造操作，对删除操作的记录不受影响
setting.ctrlz.recordOverride.name = 记录被覆盖方块
setting.ctrlz.recordOverride.description = 这将决定被覆盖的方块能否复原(建议打开该选项)
setting.ctrlz.showHint.name = 撤销时提示
setting.ctrlz.showHint.description = 这将决定模组是否在撤销时给予提示反馈
setting.ctrlz.hintSize.name = 提示浮字大小
setting.ctrlz.hintSize.description = 这将决定撤销提示浮字的大小
